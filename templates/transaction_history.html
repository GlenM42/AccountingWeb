{{define "content"}}
<div class="page-header d-flex align-items-center">
  <h4 class="page-title mb-0">Transaction History</h4>
  <div class="ms-auto">
    <a href="/new_transaction" class="btn btn-primary btn-sm">
      <i class="fas fa-plus me-1"></i> New Transaction
    </a>
  </div>
</div>

<div class="card mt-3">
  <div class="card-body">
    <table id="txTable" class="table table-striped table-hover" style="width:100%">
      <thead>
        <tr>
          <th>Date</th>
          <th>Debit</th>
          <th>Credit</th>
          <th>Description</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        {{range .Transactions}}
        <tr>
          <td>{{.Date}}</td>
          <td>{{.Debit}}</td>
          <td>{{.Credit}}</td>
          <td>{{.Description}}</td>
          <td>${{.Amount}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
