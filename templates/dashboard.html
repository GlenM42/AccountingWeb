{{define "content"}}
<div class="page-header">
  <h4 class="page-title">Dashboard</h4>
</div>
<p class="text-muted mb-4">Welcome back, <strong>{{.Username}}</strong>!</p>

<div class="row">

  <div class="col-sm-6 col-lg-4 mb-4">
    <a href="/balance_sheet" class="text-decoration-none">
      <div class="card card-stats card-round h-100">
        <div class="card-body">
          <div class="row align-items-center">
            <div class="col-icon">
              <div class="icon-big text-center icon-primary bubble-shadow-small">
                <i class="fas fa-balance-scale"></i>
              </div>
            </div>
            <div class="col col-stats ms-3 ms-sm-0">
              <div class="numbers">
                <p class="card-category">Reports</p>
                <h4 class="card-title">Balance Sheet</h4>
              </div>
            </div>
          </div>
        </div>
      </div>
    </a>
  </div>

  <div class="col-sm-6 col-lg-4 mb-4">
    <a href="/income_statement" class="text-decoration-none">
      <div class="card card-stats card-round h-100">
        <div class="card-body">
          <div class="row align-items-center">
            <div class="col-icon">
              <div class="icon-big text-center icon-success bubble-shadow-small">
                <i class="fas fa-chart-line"></i>
              </div>
            </div>
            <div class="col col-stats ms-3 ms-sm-0">
              <div class="numbers">
                <p class="card-category">Reports</p>
                <h4 class="card-title">Income Statement</h4>
              </div>
            </div>
          </div>
        </div>
      </div>
    </a>
  </div>

  <div class="col-sm-6 col-lg-4 mb-4">
    <a href="/transaction_history" class="text-decoration-none">
      <div class="card card-stats card-round h-100">
        <div class="card-body">
          <div class="row align-items-center">
            <div class="col-icon">
              <div class="icon-big text-center icon-info bubble-shadow-small">
                <i class="fas fa-list"></i>
              </div>
            </div>
            <div class="col col-stats ms-3 ms-sm-0">
              <div class="numbers">
                <p class="card-category">Transactions</p>
                <h4 class="card-title">Transaction History</h4>
              </div>
            </div>
          </div>
        </div>
      </div>
    </a>
  </div>

  <div class="col-sm-6 col-lg-4 mb-4">
    <a href="/new_transaction" class="text-decoration-none">
      <div class="card card-stats card-round h-100">
        <div class="card-body">
          <div class="row align-items-center">
            <div class="col-icon">
              <div class="icon-big text-center icon-warning bubble-shadow-small">
                <i class="fas fa-plus-circle"></i>
              </div>
            </div>
            <div class="col col-stats ms-3 ms-sm-0">
              <div class="numbers">
                <p class="card-category">Transactions</p>
                <h4 class="card-title">New Transaction</h4>
              </div>
            </div>
          </div>
        </div>
      </div>
    </a>
  </div>

</div>
{{end}}
